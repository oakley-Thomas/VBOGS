# Local development profile for NVIDIA PhysicalAI AV clips converted to NCore.
#
# The clip id must match a converted NCore sequence under `dataset.ncore_root`.

dataset:
  name: nvidia_ncore
  scene_id: pai_example_clip
  ncore_root: null
  camera_ids:
    - camera_front_wide_120fov
    - camera_front_tele_30fov
  point_source: lidar
  camera_depth_pair: camera_front_wide_120fov,camera_front_tele_30fov
  lidar_id: lidar_top_360fov

pipeline:
  start_at: prepare
  stop_after: bundle
  dry_run: false

outputs:
  run_root: outputs/v1_0

inputs:
  raw_root: null
  poses_root: null
  calibration_dir: null

prepare:
  frame_step: 2
  max_frames: 200
  copy_mode: copy
  seed_mode: lidar

train:
  gpu: "0"
  resolution: 4
  iterations: 30000
  llffhold: 8
  eval: false
  gaussian_type: explicit3D
  feat_dim: 16
  base_layer: 9
  visible_threshold: 0.02
  write_config_only: false

points:
  frame_split: train
  matcher: sgbm
  pixel_step: 2
  max_points_per_frame: 100000
  write_ply: true

bucket:
  model_path: null
  bucket_iteration: -1
  point_chunk_size: 1000000
  max_points: 10000000

fit:
  jax_device: 0
  fit_mode: batched
  batch_size: 5000
  vmap_group_size: 64
  log_every: 500

inspect:
  top_k: 5
  sample_points: 5
  anchor_id: null
  export_ply: null

uncertainty:
  u_max: null
  no_histogram: false

render:
  split: both
  resolution: 2
  max_views: 0
  colormap: turbo
  vmin: null
  vmax: null
  output_dir: null

nbv:
  candidate_source: test
  max_candidates: 0
  top_k: 10
  save_top_images: 5
  force_all_levels: false
  output_dir: null
