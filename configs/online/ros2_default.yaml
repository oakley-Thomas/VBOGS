# ROS2 online VBOGS configuration.
#
# This profile assumes the Octree-AnyGS scene has already been trained and an
# online state bundle has been created with `scripts/build_online_state.py`.

online:
  state_root: data/online/2013_05_28_drive_0008_sync
  model_path: null
  octree_root: Octree-AnyGS
  iteration: -1
  device: cuda
  deadline_sec: 1.0
  max_candidates: 32
  force_all_levels: false
  publish_uncertainty_image: false

topics:
  left_image: /camera/left/image_rect
  right_image: /camera/right/image_rect
  left_camera_info: /camera/left/camera_info
  current_pose: /localization/pose
  candidate_poses: /planner/nbv_candidates
  best_pose: /vbogs/nbv_pose
  candidate_scores: /vbogs/nbv_scores
  diagnostics: /vbogs/diagnostics
  uncertainty_image: /vbogs/uncertainty_image

stereo:
  matcher: sgbm
  baseline_m: 0.537
  matcher_min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  min_disparity: 1.0
  lr_consistency_threshold: 1.5
  texture_window_size: 5
  texture_threshold: 3.0
  pixel_step: 2
  max_depth_m: 120.0
  max_points_per_frame: 150000
  random_seed: 0

normalization:
  outlier_z: 6.0

handoff:
  batch_dir: batches
  update_dir: updates
  poll_updates_sec: 0.05
