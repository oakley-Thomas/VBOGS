site_name: VBOGS Documentation
site_description: Project documentation for VBOGS, a next-best-view uncertainty pipeline built from Octree-AnyGS and VBGS.
repo_url: https://github.com/oakley-Thomas/VBOGS
repo_name: oakley-Thomas/VBOGS
docs_dir: docs
use_directory_urls: true
exclude_docs: |
  algorithm/**
  development/**
  documentation/**
  manuscript/**
  reference/**
  references/**
  requirements.txt
  running/docker-pipeline.md
  running/full-drive.md
  running/portainer.md
  running/validation.md

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/index.md
      - Pipeline Overview: getting-started/pipeline-overview.md
      - Deployment: getting-started/deployment.md
      - Data Setup: getting-started/data.md
      - Environments: getting-started/environments.md
      - Download and View Artifacts: getting-started/local-artifact-viewing.md
      - Render Server API: running/realtime-viewer.md
  - Experiments:
      - 3D Baseline Drive Sweep: experiments/experiment02.md
      - Stereo Training Comparison: experiments/experiment03.md
      - Camera-Count Comparison: experiments/experiment04.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/vbogs.css
