# Explicit local-development overlay for docker/compose/compose.yml.
#
# Usage:
#   docker compose --project-directory . -f docker/compose/compose.yml -f docker/compose/dev.yml up -d --no-build

services:
  vbogs-torch:
    ports:
      - "${VBOGS_VIEWER_PORT:-8070}:8070"
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: bind
        source: ${VBOGS_LOCAL_OUTPUTS:-./outputs}
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS
      - type: volume
        source: vbogs-torch-cache
        target: /root/.cache/torch

  vbogs-jax:
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: volume
        source: vbogs-outputs
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS

  vbogs-vbgs-render:
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: volume
        source: vbogs-outputs
        target: /workspace/VBOGS/outputs
      - type: volume
        source: COLMAP
        target: /data/COLMAP

  vbogs-pipeline:
    environment:
      VBOGS_PIPELINE_CONFIG: ${VBOGS_PIPELINE_CONFIG:-configs/pipeline/dev.yaml}
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: bind
        source: ${VBOGS_LOCAL_OUTPUTS:-./outputs}
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS
