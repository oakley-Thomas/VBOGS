services:
  vbogs-torch:
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: volume
        source: vbogs-outputs
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS
      - type: volume
        source: vbogs-torch-cache
        target: /root/.cache/torch

  vbogs-jax:
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: volume
        source: vbogs-outputs
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS

  vbogs-pipeline:
    environment:
      VBOGS_PIPELINE_CONFIG: ${VBOGS_PIPELINE_CONFIG:-configs/pipeline/dev.yaml}
    volumes:
      - type: bind
        source: .
        target: /workspace/VBOGS
      - type: volume
        source: vbogs-data
        target: /workspace/VBOGS/data
      - type: volume
        source: KITTI-360
        target: /workspace/VBOGS/data/KITTI-360
      - type: volume
        source: NVIDIA-PhysicalAI-AV-NCore
        target: /workspace/VBOGS/data/NVIDIA-PhysicalAI-AV-NCore
      - type: volume
        source: vbogs-outputs
        target: /workspace/VBOGS/outputs
      - type: volume
        source: vbogs-generated-configs
        target: /workspace/VBOGS/generated_configs
      - type: volume
        source: COLMAP
        target: /data/COLMAP
      - type: volume
        source: OCTREE-ANYGS
        target: /data/OCTREE-ANYGS

  vbogs-filebrowser:
    volumes:
      - type: bind
        source: .
        target: /srv/project
        read_only: true
